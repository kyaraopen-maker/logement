<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <title>Vente Rapide | Marketplace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="intro-active">

    <div id="introScreen" class="intro-screen">
        <video autoplay muted loop playsinline class="intro-video">
            <source src="https://cdn.pixabay.com/video/2019/09/24/27178-361730768_large.mp4" type="video/mp4">
        </video>
        <div class="intro-overlay"></div>
        <div class="intro-content">
            <h1 class="intro-title">Bienvenue sur Vente Rapide</h1>
            <p class="intro-subtitle">Faites les meilleures affaires, avant tout le monde.</p>
            <button id="enterSiteBtn" class="intro-btn">Entrer dans la boutique</button>
        </div>
    </div>

    <nav class="taskbar">
        <div class="taskbar-brand">Vente Rapide</div>
        <div class="taskbar-menu">
            <button class="btn-publish" id="openModalBtn">➕ Publier un article</button>
        </div>
    </nav>

    <div id="publishModal" class="modal">
        <div class="modal-content glass-form">
            <span class="close-btn" id="closeModalBtn">&times;</span>
            <h2>Publier un article</h2>
            <form id="sellForm">
                <input type="text" id="prodName" placeholder="Nom de l'article" required>
                <input type="number" id="prodPrice" placeholder="Prix (FCFA)" required>
                <input type="text" id="shopName" placeholder="Nom de la boutique" required>
                <input type="tel" id="phoneNumber" placeholder="Numéro (ex: 242060000000)" required>
                <input type="file" id="imageInput" accept="image/*" multiple required>
                <button type="submit">Publier l'article</button>
            </form>
        </div>
    </div>

    <header class="hero">
        <video autoplay muted loop playsinline class="bg-video">
            <source src="https://www.w3schools.com/howto/rain.mp4" type="video/mp4">
        </video>
        <div class="overlay"></div>
        <div class="hero-content">
            <h1>Vente Rapide</h1>
            <p>Achetez et vendez en toute simplicité.</p>
        </div>
    </header>

    <main class="container">
        <section class="marketplace">
            <h2>Articles en vedette</h2>
            
            <div class="product-grid" id="productGrid"></div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="script.js"></script>
    
    <script>
        // Fonction de slide des images globale
        function slideImages(button, direction) {
            const container = button.parentElement.querySelector('.card-images');
            const scrollAmount = container.clientWidth;
            if(direction === 'right') {
                container.scrollBy({ left: scrollAmount, behavior: 'smooth' });
            } else {
                container.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
            }
        }
    </script>
</body>
</html>
